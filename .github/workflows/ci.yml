name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run linter (flake8)
        run: |
          flake8 src/

  security_check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for secrets (passwords / keys)
        run: |
          echo 'Scanning codebase for sensitive patterns...'
          if grep -Eri '(password|key=)' . --exclude-dir={.git,.github}; then
            echo 'ERROR: Potential secret or sensitive key found in codebase!'
            exit 1
          else
            echo 'No secrets detected. Security check passed.'
          fi
